openapi: 3.0.0
info:
  title: Desk Booking API
  version: 1.0.0
  description: API para reserva de mesas com autenticação JWT
servers:
  - url: http://localhost:3000/api
paths:
  /register:
    post:
      summary: Registro de usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Usuário registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
        '400':
          description: Campos obrigatórios ausentes
        '409':
          description: Usuário já existe
  /login:
    post:
      summary: Login de usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Credenciais inválidas
  /desks:
    get:
      summary: Lista mesas disponíveis
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de mesas disponíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    isAvailable:
                      type: boolean
                    reservedBy:
                      type: integer
                      nullable: true
        '401':
          description: Token ausente
        '403':
          description: Token inválido
  /reserve:
    post:
      summary: Reservar uma mesa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deskId:
                  type: integer
      responses:
        '200':
          description: Reserva realizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  isAvailable:
                    type: boolean
                  reservedBy:
                    type: integer
        '400':
          description: Campo deskId ausente
        '401':
          description: Token ausente
        '403':
          description: Token inválido
        '404':
          description: Mesa não disponível
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
